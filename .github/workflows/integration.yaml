# Integration tier: runs all 14 research flows end to end and the SITAR
# recovery and selection checks (tests/testthat/test-integration.R), plus
# the sequential against parallel equality test with an installed package.
# Runs weekly, on demand, and before every release tag.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    tags: ['v*']

name: integration

permissions: read-all

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    name: integration (${{ matrix.os }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      WGH_INTEGRATION: true
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, local::.
          needs: check
      - name: Install the package (parallel workers load it from the library)
        run: R CMD INSTALL .
      - name: Full and integration tests
        run: Rscript -e 'res <- devtools::test(stop_on_failure = TRUE); print(as.data.frame(res)[, c("file", "test", "nb", "failed", "skipped", "error")])'
      - name: Examples including donttest
        run: Rscript -e 'devtools::run_examples(run_donttest = TRUE, document = FALSE)'
